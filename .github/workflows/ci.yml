name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ curl python3

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Strict warnings build
        run: |
          cmake -S . -B build_warnings -DCMAKE_CXX_FLAGS='-Wall -Wextra -Wpedantic'
          cmake --build build_warnings -j

      - name: Static analysis (cppcheck, informational)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y cppcheck
          cppcheck --enable=warning,performance,portability \
            --std=c++20 \
            --suppress=missingIncludeSystem \
            --error-exitcode=0 \
            -I include \
            src/ 2>&1 | tee cppcheck.txt
          echo "cppcheck done (informational only — does not fail CI)"
